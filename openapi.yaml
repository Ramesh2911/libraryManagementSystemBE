  # ===================== VISITORS =====================
  /api/v1/visitors:
    get:
      tags: [Visitors]
      summary: "List visitors + status summary"
      description: |
        Owner + Coordinator shared (visitor_management_api.md).
        Summary counts are computed from the UNFILTERED set; query filters apply only to `visitors`.
      x-status: implemented
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: "Matches name, phone, or company (case-insensitive)"
        - name: status
          in: query
          schema: { type: string, enum: [checked_in, checked_out] }
          description: "Omit for All"
        - name: libraryId
          in: query
          schema: { type: string }
          description: "Filters the visitors array only; summary counts remain unfiltered"
        - name: from_date
          in: query
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: to_date
          in: query
          schema: { type: string, format: date, example: '2026-11-24' }
          description: "Inclusive"
      responses:
        '200':
          description: "{summary, visitors[]}"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            type: object
                            properties:
                              total_count: { type: integer, example: 5 }
                              checked_in_count: { type: integer, example: 2 }
                              checked_out_count: { type: integer, example: 3 }
                          visitors:
                            type: array
                            items: { $ref: '#/components/schemas/Visitor' }
        '400': { $ref: '#/components/responses/Error400' }
    post:
      tags: [Visitors]
      summary: "Create visitor (Add Visitor form)"
      description: "Initial status defaults to `checked_in`. Owner + Coordinator shared."
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, phone_number, whatsapp_number, email, purpose, company, persons, visit_date_time]
              properties:
                full_name: { type: string, example: Rahul Sharma }
                phone_number: { type: string, example: '+91 98765 43210' }
                whatsapp_number: { type: string, example: '+91 98765 43210' }
                email: { type: string, format: email, example: rahul.sharma@example.com }
                purpose:
                  type: string
                  enum:
                    - Study / Workspace Visit
                    - Meeting
                    - Enquiry
                    - Admission Enquiry
                    - Parent Visit
                    - Other
                company: { type: string, example: Self / Student }
                persons: { type: integer, minimum: 1, example: 1 }
                visit_date_time: { type: string, format: date-time, example: '2026-11-24T10:30:00+05:30' }
                notes: { type: string, example: Interested in a quiet study area. }
            example:
              full_name: Rahul Sharma
              phone_number: '+91 98765 43210'
              whatsapp_number: '+91 98765 43210'
              email: rahul.sharma@example.com
              purpose: Study / Workspace Visit
              company: Self / Student
              persons: 1
              visit_date_time: '2026-11-24T10:30:00+05:30'
              notes: Interested in a quiet study area.
      responses:
        '201':
          description: Visitor saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Visitor' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/visitors/{id}/status:
    patch:
      tags: [Visitors]
      summary: "Update visitor status (checked_in / checked_out)"
      description: "Single route for both check-in and check-out - do not add separate endpoints."
      x-status: implemented
      parameters:
        - name: id
          in: path
