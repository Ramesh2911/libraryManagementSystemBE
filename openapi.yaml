  # ===================== OWNER COORDINATOR PROVISIONING (planned envelope variant) =====================
  /api/v1/owner/coordinators:
    post:
      tags: [Coordinators]
      summary: "Provision coordinator (owner setup flow, envelope contract)"
      description: "Planned alias of existing `POST /api/coordinators` under owner namespace."
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                permissions:
                  type: object
                  properties:
                    collectPayment: { type: boolean }
                    manageSeats: { type: boolean }
                    viewReports: { type: boolean }
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      floorId: { type: string }
                      readingRoomId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
        '409': { $ref: '#/components/responses/Error409' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Envelope200:
      description: "Success envelope"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error400:
      description: "Validation / bad request"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error401:
      description: "Unauthorized (missing/invalid token)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error403:
      description: "Forbidden (role / tenant)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error404:
      description: "Not found"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error409:
      description: "Conflict (duplicate)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error429:
      description: "Rate limited"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error500:
      description: "Server error"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
  schemas:
    Envelope:
      type: object
      required: [success, statusCode, message, timestamp]
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: OK }
        data: { description: Payload (shape varies per operation) }
        timestamp: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 137 }
        totalPages: { type: integer, example: 7 }
    Visitor:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        phone_number: { type: string }
        whatsapp_number: { type: string }
        email: { type: string, format: email }
        purpose: { type: string }
        company: { type: string }
        persons: { type: integer, minimum: 1 }
        visit_date_time: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [checked_in, checked_out] }
    SeatStatus:
      type: string
      enum: [vacant, occupied, reserved, half_day, blocked, maintenance]
    LockerStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, MAINTENANCE]
    CoordinatorPermissions:
      type: object
      description: "Partial boolean map over the 10 modules. Missing key = false (denied). Owner sets these; coordinator only acts on modules set to true."
      additionalProperties: false
      properties:
        students: { type: boolean, example: true }
        admissions: { type: boolean, example: true }
        payments: { type: boolean, example: false }
        deposits: { type: boolean, example: false }
        seats: { type: boolean, example: true }
        lockers: { type: boolean, example: false }
        visitors: { type: boolean, example: true }
        attendance: { type: boolean, example: true }
        setup: { type: boolean, example: false }
        analytics: { type: boolean, example: false }
