          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: hubId
          in: query
          schema: { type: string }
        - name: floorId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
