openapi: 3.0.3
info:
  title: SmartLibrary API
  description: |
    SmartLibrary Library Management System - REST API.

    **Envelope:** every JSON response uses `{success, statusCode, message, data, timestamp}`.

    **Security:** `Authorization: Bearer <JWT>` (from login/OTP verify/refresh).

    **Vendor extension:** `x-status: implemented | planned` marks whether the operation
    exists in the codebase today or is specified in `doc/*.md` and pending implementation.

    Sources: existing `src/routes/*` (implemented) + `doc/*.md` (planned).
  version: 1.0.0
servers:
  - url: https://librarymanagementsystembe-tf9i.onrender.com
    description: "Render production"
  - url: http://localhost:3000
    description: "Local dev"
  - url: https://api.smartlibrary.app
    description: Production
tags:
  - name: Health
    description: "Service health"
  - name: Auth
    description: "Authentication, OTP, sessions (doc: auth_api.md)"
  - name: Owner Setup
    description: "6-step owner onboarding (implemented)"
  - name: Student Self
    description: "Student self-profile (planned - auth_api.md)"
  - name: Libraries
  - name: Floors
  - name: Room Types
  - name: Time Slots
  - name: Reading Rooms
  - name: Seats
    description: "Seat map & allocation (doc: owner_seat_management_api_full.md)"
  - name: Lockers
    description: "Locker CRUD & assignment (doc: owner_coordinator_locker_management_api.md)"
  - name: Students
    description: "Admin-side student CRUD (existing)"
  - name: Owner Students
    description: "Owner student/admission/payment module (planned - owner_student_management_api.md)"
  - name: Admissions
  - name: Payments
  - name: Deposits
  - name: Attendance
    description: "Sync, QR sessions, register (doc: owner_coordinator_attendance_api_endpoints_only.md)"
  - name: Visitors
  - name: Coordinators
  - name: AI
  - name: Admin
    description: "Super-admin platform metrics"
  - name: Owner Dashboard
    description: "Dashboard (business-overview, revenue, seats/summary implemented); hubs, offers, notifications still planned - owner_dashboard_api.md"
  - name: Owner Analytics
    description: "Consolidated analytics + export (planned - owner_analytics_api.md)"
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: "Health check"
      security: []
      x-status: implemented
      responses:
        '200':
          description: "Service status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  redis: { type: string, example: ready }

  # ===================== AUTH (implemented) =====================
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: "Owner signup (tenant registration)"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, contact, otp]
              properties:
                name: { type: string }
                password: { type: string, format: password }
                contact: { type: string, description: "10-digit phone (OTP verified)", example: "9876543210" }
                otp: { type: string, example: "123456" }
                subscriptionPlanId: { type: string }
      responses:
        '201':
          description: "Signup success"
          $ref: '#/components/responses/Envelope200'
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: "Tenant login (phone + password for OWNER / COORDINATOR / STUDENT)"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact, password, role]
              properties:
                contact: { type: string }
                password: { type: string, format: password }
                role: { type: string, enum: [OWNER, COORDINATOR, STUDENT] }
                device: { type: string }
      responses:
        '200':
          description: "Login result (may require 2FA step). COORDINATOR responses include `permissions` (module map) and `user` object."
          $ref: '#/components/responses/Envelope200'
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/login/verify-2fa:
    post:
      tags: [Auth]
      summary: "Complete login with TOTP 2FA code"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, example: '123456' }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/admin/login:
    post:
      tags: [Auth, Admin]
      summary: "Web admin login (phone + password, no OTP)"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "9000000001" }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: "Refresh access token"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: "Refresh access token (doc-style path)"
      description: "Alias of POST /api/auth/refresh - matches auth_api.md path."
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /admin/auth/login:
    post:
      tags: [Auth, Admin]
      summary: "Super-admin login (doc-style path)"
      description: "Alias of POST /api/auth/admin/login - matches auth_api.md path."
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: "Logout (revoke session)"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: "Reset password (phone OTP verify)"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp, newPassword, role]
              properties:
                phone: { type: string, example: "9876543210" }
                otp: { type: string, example: "123456" }
                newPassword: { type: string, format: password }
                role: { type: string, enum: [OWNER, COORDINATOR] }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: "Start TOTP 2FA setup (returns QR / secret)"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: "Confirm TOTP 2FA setup"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: "List active sessions"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: "Revoke a session"
      x-status: implemented
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '404': { $ref: '#/components/responses/Error404' }

  # ===================== AUTH (planned - auth_api.md) =====================
  /api/v1/auth/send-otp:
    post:
      tags: [Auth]
      summary: "Send 6-digit OTP to phone"
      description: "Sends OTP for account creation and password reset (NOT for login). OTP is always `123456` in dev (Redis, 5min TTL, 30s cooldown, max 3/10min). Any 10-digit phone accepted in dev; production restricts to allowlist until SMS gateway. Response may include `devOtp` outside production."
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '9876543210' }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
        '429': { $ref: '#/components/responses/Error429' }
  /api/v1/auth/resend-otp:
    post:
      tags: [Auth]
      summary: "Resend OTP (30s cooldown, max 3 / 10min)"
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '429': { $ref: '#/components/responses/Error429' }
  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: "Sign in with Google ID token"
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: "Current user profile + roles + setup flags"
      description: "Returns JWT claims. For COORDINATOR, also returns current `permissions` (loaded fresh from DB)."
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '401': { $ref: '#/components/responses/Error401' }

  # ===================== LIBRARIES (implemented) =====================
  /api/v1/libraries:
    get:
      tags: [Libraries]
      summary: "List libraries (hubs) for tenant"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    post:
      tags: [Libraries]
      summary: "Create library hub"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                address: { type: string }
                phone: { type: string }
                email: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/libraries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Libraries]
      summary: "Update library"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Libraries]
      summary: "Delete library"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '404': { $ref: '#/components/responses/Error404' }

  # ===================== FLOORS (implemented) =====================
  /api/v1/floors:
    get:
      tags: [Floors]
      summary: "List floors"
      description: "When `libraryId` is provided, only floors of that library are returned."
      x-status: implemented
      parameters:
        - name: libraryId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    post:
      tags: [Floors]
      summary: "Create floor"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, libraryId]
              properties:
                name: { type: string }
                libraryId: { type: string }
                displayOrder: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
  /api/v1/floors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Floors]
      summary: "Update floor"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    delete:
      tags: [Floors]
      summary: "Delete floor"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }

  # ===================== ROOM TYPES =====================
  /api/v1/room-types:
    get:
      tags: [Room Types]
      summary: "List room types"
      description: "When `libraryId` is provided, only room types used by that library's reading rooms are returned."
      x-status: implemented
      parameters:
        - name: libraryId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    post:
      tags: [Room Types]
      summary: "Create room type"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: "{ type: string }"
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
  /api/v1/room-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Room Types]
      summary: "Update room type"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    delete:
      tags: [Room Types]
      summary: "Delete room type"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }

  # ===================== TIME SLOTS =====================
  /api/v1/time-slots:
    get:
      tags: [Time Slots]
      summary: "List time slots"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    post:
      tags: [Time Slots]
      summary: "Create time slot"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startTime, endTime]
              properties:
                name: { type: string }
                startTime: { type: string, example: '09:00' }
                endTime: { type: string, example: '12:00' }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
  /api/v1/time-slots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Time Slots]
      summary: "Update time slot"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    delete:
      tags: [Time Slots]
      summary: "Delete time slot"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }

  # ===================== READING ROOMS =====================
  /api/v1/reading-rooms:
    get:
      tags: [Reading Rooms]
      summary: "List reading rooms"
      description: "Planned contract: filter `?floorId=`."
      x-status: implemented
      parameters:
        - name: floorId
          in: query
          schema: { type: string }
        - name: libraryId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    post:
      tags: [Reading Rooms]
      summary: "Create reading room"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, floorId]
              properties:
                name: { type: string }
                floorId: { type: string }
                roomTypeId: { type: string }
                capacity: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
  /api/v1/reading-rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Reading Rooms]
      summary: "Update reading room"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
    delete:
      tags: [Reading Rooms]
      summary: "Delete reading room"
      x-status: implemented
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }

  # ===================== SEATS (implemented + planned contract) =====================
  /api/v1/seats/map:
    get:
      tags: [Seats]
      summary: "Seat map for floor/room"
      description: |
        Existing: `roomId`. Planned contract (owner_seat_management_api_full.md):
        `floorId` **or** `roomId`, `status`, `includeAllocation`, `asOfDate`,
        response `{floor, room, summary:{vacant,occupied,reserved,half_day,total}, seats[]}`.
      x-status: implemented
      parameters:
        - name: roomId
          in: query
          schema: { type: string }
        - name: floorId
          in: query
          schema: { type: string }
          x-status: planned
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SeatStatus' }
          x-status: planned
        - name: includeAllocation
          in: query
          schema: { type: boolean, default: false }
          x-status: planned
        - name: asOfDate
          in: query
          schema: { type: string, format: date }
          x-status: planned
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/seats/summary:
    get:
      tags: [Seats]
      summary: "Seat summary counts for dashboard"
      description: |
        Counts for ACTIVE seats in a library (optional floor/roomType filters).
        Invariants: `totalSeats = filledSeats + vacantSeats`,
        `filledSeats = settledSeats + pendingSeats`.
        `pendingSeats` = filled seats whose student has an overdue unpaid FeeObligation
        (due_date in past, status in DUE/PARTIALLY_PAID/OVERDUE, amount_paid < amount_due).
        Day boundaries use Asia/Kolkata (UTC+5:30).
      x-status: implemented
      parameters:
        - name: libraryId
          in: query
          required: true
          schema: { type: string }
        - name: floorId
          in: query
          schema: { type: string }
        - name: roomTypeId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: "Seat summary"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          libraryId: { type: string }
                          filters:
                            type: object
                            properties:
                              floorId: { type: string, nullable: true }
                              roomTypeId: { type: string, nullable: true }
                          totalSeats: { type: integer }
                          filledSeats: { type: integer }
                          vacantSeats: { type: integer }
                          pendingSeats: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/seats/{id}/allocate:
    post:
      tags: [Seats]
      summary: "Allocate seat to student"
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId: { type: string }
                admissionId: { type: string }
                feePlanId: { type: string }
                startDate: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Envelope200' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/v1/seats/{id}/transfer:
    post:
      tags: [Seats]
      summary: "Transfer seat (atomic old-vacate + new-allocate)"
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: "Current seat id"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSeatId, studentId]
              properties:
                newSeatId: { type: string }
                studentId: { type: string }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/v1/seats/{id}/vacate:
    post:
      tags: [Seats]
      summary: "Vacate occupied seat"
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/v1/seats/{id}/status:
    patch:
      tags: [Seats]
      summary: "Set seat status (block / maintenance / restore)"
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/SeatStatus' }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/v1/seats/{id}/history:
    get:
      tags: [Seats]
      summary: "Seat allocation history"
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope200' }

  # ===================== LOCKERS =====================
  /api/v1/lockers:
    get:
      tags: [Lockers]
      summary: "List lockers"
      description: "Planned contract (owner_coordinator_locker_management_api.md): `search`, `status`, pagination + `summary` + `currentAssignment`."
      x-status: implemented
      parameters:
        - name: search
          in: query
          schema: { type: string }
          x-status: planned
        - name: status
          in: query
          schema: { type: string, enum: [AVAILABLE, ASSIGNED, MAINTENANCE] }
          x-status: planned
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          x-status: planned
