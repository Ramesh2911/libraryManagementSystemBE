  # ===================== OWNER ANALYTICS (planned - owner_analytics_api.md) =====================
  /api/v1/owner/analytics:
    get:
      tags: [Owner Analytics]
      summary: "Consolidated analytics payload"
      description: |
        One response containing: financial overview, metric cards, revenue trend,
        seat analytics by floor, active students, daily visits, collection/overdue
        summary (1-7 / 8-15 / 16+ buckets), and insights.
      x-status: planned
      parameters:
